name: Windows GCC build verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: x265-windows-gcc-verification
  cancel-in-progress: true

env:
  UPSTREAM: https://github.com/Multicorewareinc/x265.git

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - id: source
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git ls-remote "$UPSTREAM" refs/heads/master | awk '{print $1}')"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: windows-2022
    name: Windows MinGW GCC multilib
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Multicorewareinc/x265
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 1
          path: x265
      - uses: actions/checkout@v4
        with:
          path: nightly-tools
      - name: Install MinGW GCC and build tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-ninja
            zip
      - name: Build 8+10+12-bit multilib
        shell: msys2 {0}
        run: |
          set -euo pipefail
          bash nightly-tools/scripts/build-windows-multilib.sh "$PWD/x265" "$PWD/x265/build/multilib"
      - uses: actions/upload-artifact@v4
        with:
          name: x265-windows-x86_64-gcc-multilib
          path: x265/x265-windows-x86_64-gcc-multilib.zip
          retention-days: 14
