name: MSVC nightly build

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: x265-windows-msvc-nightly
  cancel-in-progress: true

env:
  UPSTREAM: https://github.com/Multicorewareinc/x265.git

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      changed: ${{ steps.source.outputs.changed }}
    steps:
      - id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git ls-remote "$UPSTREAM" refs/heads/master | awk '{print $1}')"
          short="${sha:0:12}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif gh release view "nightly-$short" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: windows-2022
    name: Windows MSVC multilib
    steps:
      - uses: actions/checkout@v6
        with:
          repository: Multicorewareinc/x265
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          path: x265
      - uses: actions/checkout@v6
        with:
          path: nightly-tools
      - name: Install NASM
        shell: pwsh
        run: choco install nasm -y --no-progress
      - name: Build 8+10+12-bit multilib
        shell: pwsh
        run: .\nightly-tools\scripts\build-windows-multilib-msvc.ps1 -SourceDir .\x265 -OutputDir .\x265\build\multilib
      - uses: actions/upload-artifact@v7
        with:
          name: x265-windows-x86_64-msvc-multilib
          path: x265/x265-windows-x86_64-msvc-multilib.zip
          retention-days: 14

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: x265-windows-x86_64-msvc-multilib
          path: dist
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          short="${SHA:0:12}"
          tag="nightly-$short"
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "MSVC nightly build: $short" \
            --notes "Windows x86_64 MSVC multilib (8/10/12-bit) built from upstream commit [$SHA](https://github.com/Multicorewareinc/x265/commit/$SHA)."
